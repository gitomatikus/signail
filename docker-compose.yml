# All ports, URLs and origins come from the root .env file (see .env.example).
services:
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
      args:
        - BACKEND_PORT=${BACKEND_PORT:-8000}
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${BACKEND_PORT:-8000}
      - WS_PATH=${WS_PATH:-/ws}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - CHOKIDAR_USEPOLLING=true
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
      args:
        - FRONTEND_PORT=${FRONTEND_PORT:-3001}
    ports:
      - "${FRONTEND_PORT:-3001}:${FRONTEND_PORT:-3001}"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL:-}
      - REACT_APP_WS_URL=${REACT_APP_WS_URL:-}
      - REACT_APP_API_PORT=${REACT_APP_API_PORT:-8000}
      - REACT_APP_WS_PORT=${REACT_APP_WS_PORT:-8000}
      - REACT_APP_WS_PATH=${REACT_APP_WS_PATH:-/ws}
      - REACT_APP_DEFAULT_HOST=${REACT_APP_DEFAULT_HOST:-}
      - REACT_APP_PACK_EDITOR_URL=${REACT_APP_PACK_EDITOR_URL:-https://packer.critfail.art}
      - WDS_SOCKET_PORT=0
      - PORT=${FRONTEND_PORT:-3001}
      - HOST=0.0.0.0
      - NODE_ENV=${NODE_ENV:-development}
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
